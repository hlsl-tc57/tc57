needs-triage:
- changed-files:
  - any-glob-to-any-file: 'proposals/**/*'

language-spec:
- changed-files:
  - any-glob-to-any-file: 'spec/**/*'

# Apply the normative label to any change to latex that extends beyond an annex
# or the macros file.
normative:
- changed-files:
  - any-glob-to-any-file: 'spec/**/*.tex'
  - any-globs-to-all-files:
    - !'spec/**/annex-*.tex'
    - !'spec/macros.tex'
    - !'spec/hlsl.tex'

documentation:
- changed-files:
  - any-glob-to-any-file:
    - 'docs/**/*.md'
    - 'README.md'
    - 'CONTRIBUTING.md'
  - all-globs-to-all-files: '!docs/Meetings/*.md' # Ignore meetings files

website:
- changed-files:
    - any-glob-to-any-file:
      - 'assets/**/*'
      - 'websites/**/*'

agenda:
- changed-files:
  - any-glob-to-any-file: 'docs/Meetings/*-agenda.md'

minutes:
- changed-files:
  - any-glob-to-any-file: 'docs/Meetings/*-minutes.md'

infrastructure:
- changed-files:
  - any-glob-to-any-file:
    - '.github/**/*'
    - 'scripts/**/*'
    - 'Dockerfile'
    - 'docker-compose.yml'
    - 'CODEOWNERS'
