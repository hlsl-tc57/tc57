name: Comment Pull Request Check

on:
  workflow_run:
    workflows: ["Check Pull Request"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: pr-check-report-${{ github.event.workflow_run.id }}
          path: pr-check-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Create or update pull request comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- tc57-pr-check -->";
            const report = fs.readFileSync("pr-check-report/report.md", "utf8").trim();
            const issue_number = Number(
              fs.readFileSync("pr-check-report/pr-number.txt", "utf8").trim()
            );
            const maximumReportLength = 65000 - marker.length;
            const displayedReport = report.length <= maximumReportLength
              ? report
              : `${report.slice(0, maximumReportLength)}\n\n_Report truncated; see the workflow log for all results._`;
            const body = `${marker}\n${displayedReport}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previousComment = comments.find(
              comment => comment.user?.type === "Bot" && comment.body?.startsWith(marker)
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
